# Configuration Apache2 pour dev2site.net avec Next.js

# Redirection HTTP -> HTTPS
<VirtualHost *:80>
    ServerName dev2site.net
    ServerAlias www.dev2site.net

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =www.dev2site.net [OR]
    RewriteCond %{SERVER_NAME} =dev2site.net
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/dev2site-8080-error.log
    CustomLog ${APACHE_LOG_DIR}/dev2site-8080-access.log combined
</VirtualHost>

# HTTPS sur port 443
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dev2site.net
    ServerAlias www.dev2site.net

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/dev2site.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dev2site.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    Protocols h2 http/1.1

    DocumentRoot /var/www/html/prod

    <Directory /var/www/html/prod/dev2site3/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On

    # --- Next.js (port 3000) pour la racine ---
    # Routes API de Next.js doivent être AVANT le proxy Strapi /api/
    ProxyPass "/api/chat" "http://localhost:3010/api/chat"
    ProxyPassReverse "/api/chat" "http://localhost:3010/api/chat"

    # Tout le reste vers Next.js
    ProxyPass "/" "http://localhost:3010/"
    ProxyPassReverse "/" "http://localhost:3010/"
    
    # Apps React sur dev2site
    ProxyPass "/app1/" "http://localhost:4000/"
    ProxyPassReverse "/app1/" "http://localhost:4000/"

    ProxyPass "/app2/" "http://localhost:4001/"
    ProxyPassReverse "/app2/" "http://localhost:4001/"

    ProxyPass "/app3/" "http://localhost:4002/"
    ProxyPassReverse "/app3/" "http://localhost:4002/"
    
    # Strapi Admin pour dev2site
    <Location "/strapi-admin/">
        Header unset Access-Control-Allow-Origin
        Header set Access-Control-Allow-Origin "https://dev2site.net"
    </Location>
    ProxyPass "/strapi-admin/" "http://localhost:1337/admin/"
    ProxyPassReverse "/strapi-admin/" "http://localhost:1337/admin/"

    # Strapi API pour dev2site uniquement
    # NOTE : en l'état, ce proxy est en conflit avec /api/chat ci-dessus qui est traité en premier.
    # Si vous devez conserver Strapi sur /api/, déplacez-le sous /strapi/api/ côté Strapi et Apache.
    <Location "/api/">
        SetEnvIf Origin "^(https?://(www\.)?pierrebazin\.fr(:[0-9]+)?)$" CORS_ORIGIN=$0
        SetEnvIf Origin "^(https?://dev2site\.net(:[0-9]+)?)$" CORS_ORIGIN=$0

        Header always unset Access-Control-Allow-Origin
        Header always unset Access-Control-Allow-Methods
        Header always unset Access-Control-Allow-Headers
        Header always unset Access-Control-Max-Age

        Header always set Access-Control-Allow-Origin "%{CORS_ORIGIN}e" env=CORS_ORIGIN
        Header always set Access-Control-Allow-Credentials "true"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization"
        Header always set Access-Control-Max-Age "3600"

        RewriteEngine On
        RewriteCond %{REQUEST_METHOD} OPTIONS
        RewriteRule .* - [R=200,L]
    </Location>
    ProxyPass "/api/" "http://localhost:1337/api/"
    ProxyPassReverse "/api/" "http://localhost:1337/api/"
    
    # Strapi Uploads pour dev2site
    <Location "/uploads/">
        Header unset Access-Control-Allow-Origin
        Header set Access-Control-Allow-Origin "https://dev2site.net"
    </Location>
    ProxyPass "/uploads/" "http://localhost:1337/uploads/"
    ProxyPassReverse "/uploads/" "http://localhost:1337/uploads/"

    ErrorLog ${APACHE_LOG_DIR}/dev2site-443-error.log
    CustomLog ${APACHE_LOG_DIR}/dev2site-443-access.log combined
</VirtualHost>
</IfModule>

# Reverse Proxy sur 4000 -> 5000 (inchangé)
<VirtualHost *:4000>
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/dev2site.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dev2site.net/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    ErrorLog ${APACHE_LOG_DIR}/api-https-4000-error.log
    CustomLog ${APACHE_LOG_DIR}/api-https-4000-access.log combined
</VirtualHost>

