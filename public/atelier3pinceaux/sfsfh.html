<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function() {
  const brush = document.getElementById('caca');
  const wave  = document.getElementById('wave');

  const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.4 });

  tl
    // Anticipation : légère remontée avant de plonger
    .to(brush, {
      y: -10,
      duration: 0.18,
      ease: 'back.in(2)',
    })
    // Plongée avec accélération naturelle
    .to(brush, {
      y: 95,
      duration: 0.55,
      ease: 'power2.in',
    })
    // Splash : la surface se déforme à l'impact
    .to(wave, {
      y: 5,
      scaleY: 1.12,
      transformOrigin: 'center bottom',
      duration: 0.18,
      ease: 'power1.out',
    }, '-=0.1')
    // Rebond de la vague
    .to(wave, {
      y: -3,
      scaleY: 0.92,
      duration: 0.22,
      ease: 'sine.inOut',
    })
    // Retour au repos de la vague (élastique)
    .to(wave, {
      y: 0,
      scaleY: 1,
      duration: 0.3,
      ease: 'elastic.out(1, 0.5)',
    })
    // Remontée du pinceau (après une pause dans l'eau)
    .to(brush, {
      y: 0,
      duration: 0.6,
      ease: 'power3.out',
      delay: 0.5,
    })
    // Overshooot léger en fin de remontée
    .to(brush, {
      y: -6,
      duration: 0.14,
      ease: 'power1.out',
    })
    // Rebond final pour amortir l'arrêt
    .to(brush, {
      y: 0,
      duration: 0.22,
      ease: 'bounce.out',
    });
})();
</script>
