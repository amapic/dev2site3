<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curis - Agriculture uniquement</title>
  <style>
    :root {
      --bg: #efe7d9;
      --panel: rgba(255, 250, 240, 0.92);
      --ink: #2a241e;
      --line: #d9cbb0;
      --accent: #8c6a3d;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, rgba(250, 246, 238, 0.92) 0%, rgba(239, 231, 217, 0.86) 55%, rgba(227, 214, 191, 0.82) 100%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: min(380px, calc(100vw - 32px));
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 45px rgba(55, 38, 16, 0.16);
      padding: 14px 16px;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.05rem;
      line-height: 1.2;
    }

    p {
      margin: 0 0 8px;
      line-height: 1.45;
      font-size: 0.9rem;
    }

    .chip {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(140, 106, 61, 0.12);
      border: 1px solid rgba(140, 106, 61, 0.25);
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .legend {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="panel">
      <h1>Agriculture uniquement</h1>
      <p>Visualisation des polygones OSM agricoles, sans projection sur le LiDAR.</p>
      <p id="center">Centre carte: -</p>
      <p id="status">Chargement...</p>
      <span class="chip">orbite: clic gauche | zoom: molette | deplacement: clic droit</span>
      <div class="legend">
        <div><strong>Champs:</strong> landuse=farmland</div>
        <div><strong>Vignes:</strong> landuse=vineyard</div>
        <div><strong>Vergers:</strong> landuse=orchard</div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const app = document.getElementById('app');
    const statusEl = document.getElementById('status');
    const centerEl = document.getElementById('center');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#f1e8d7');

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 40000);
    camera.position.set(1600, 1200, 1900);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    scene.add(new THREE.HemisphereLight('#fff6e6', '#7d6a52', 0.9));

    const grid = new THREE.GridHelper(5000, 24, '#8a826f', '#cdbfa5');
    grid.position.y = -5;
    scene.add(grid);

    function lonLatToScene(lon, lat, metadata) {
      const minLon = metadata.bbox.minLon;
      const maxLon = metadata.bbox.maxLon;
      const minLat = metadata.bbox.minLat;
      const maxLat = metadata.bbox.maxLat;
      const metersX = (maxLon - minLon) * metadata.metersPerDegree.lon;
      const metersZ = (maxLat - minLat) * metadata.metersPerDegree.lat;
      const u = (lon - minLon) / (maxLon - minLon);
      const v = 1 - (lat - minLat) / (maxLat - minLat);

      return {
        x: u * metersX - metersX / 2,
        z: v * metersZ - metersZ / 2,
      };
    }

    function pushPolygon(ring, target, metadata, height) {
      if (!Array.isArray(ring) || ring.length < 4) return;
      const outer = ring.slice(0, -1).map(([lon, lat]) => lonLatToScene(lon, lat, metadata));
      if (outer.length < 3) return;

      const shape = outer.map((point) => new THREE.Vector2(point.x, point.z));
      const triangles = THREE.ShapeUtils.triangulateShape(shape, []);

      for (const tri of triangles) {
        for (const idx of tri) {
          const point = outer[idx];
          target.push(point.x, height, point.z);
        }
      }
    }

    function buildMesh(positions, color, opacity) {
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.computeVertexNormals();

      return new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.9,
          metalness: 0.0,
          transparent: true,
          opacity,
          side: THREE.DoubleSide,
        })
      );
    }

    async function main() {
      const metadata = await fetch('./curis-terrain-metadata.json').then((r) => r.json());
      const landuseCollection = await fetch('./curis-landuse-features.geojson').then((r) => r.json());

      const centerLon = (metadata.bbox.minLon + metadata.bbox.maxLon) / 2;
      const centerLat = (metadata.bbox.minLat + metadata.bbox.maxLat) / 2;
      if (centerEl) {
        centerEl.textContent = `Centre carte: lat ${centerLat.toFixed(6)}, lon ${centerLon.toFixed(6)}`;
      }

      const farmlandPositions = [];
      const vineyardPositions = [];
      const orchardPositions = [];

      const counts = {
        farmland: 0,
        vineyard: 0,
        orchard: 0,
      };

      for (const feature of landuseCollection.features || []) {
        const kind = feature.properties?.kind;
        if (!kind || !(kind in counts)) continue;

        const target = kind === 'farmland'
          ? farmlandPositions
          : kind === 'vineyard'
            ? vineyardPositions
            : orchardPositions;

        if (feature.geometry?.type === 'Polygon') {
          pushPolygon(feature.geometry.coordinates?.[0] || [], target, metadata, 8);
          counts[kind] += 1;
        } else if (feature.geometry?.type === 'MultiPolygon') {
          for (const polygon of feature.geometry.coordinates || []) {
            pushPolygon(polygon?.[0] || [], target, metadata, 8);
          }
          counts[kind] += 1;
        }
      }

      if (!farmlandPositions.length && !vineyardPositions.length && !orchardPositions.length) {
        statusEl.textContent = 'Aucune zone agricole trouvee.';
        return;
      }

      if (farmlandPositions.length) {
        scene.add(buildMesh(farmlandPositions, '#e5c26a', 0.75));
      }
      if (vineyardPositions.length) {
        scene.add(buildMesh(vineyardPositions, '#b38db8', 0.78));
      }
      if (orchardPositions.length) {
        scene.add(buildMesh(orchardPositions, '#d9a86f', 0.78));
      }

      const allPositions = farmlandPositions.concat(vineyardPositions, orchardPositions);
      const bboxGeometry = new THREE.BufferGeometry();
      bboxGeometry.setAttribute('position', new THREE.Float32BufferAttribute(allPositions, 3));
      const box = new THREE.Box3().setFromBufferAttribute(bboxGeometry.getAttribute('position'));

      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.z);
      const fitDist = maxDim / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)));

      camera.position.set(center.x + fitDist * 0.7, center.y + fitDist * 0.6 + 500, center.z + fitDist * 0.7);
      controls.target.copy(center);
      controls.update();

      statusEl.textContent = `${counts.farmland} champs, ${counts.vineyard} vignes, ${counts.orchard} vergers (sans projection LiDAR)`;
    }

    main().catch((error) => {
      console.error(error);
      statusEl.textContent = 'Erreur de chargement.';
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
