<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topo Terrain OBJ Viewer</title>
  <style>
    :root {
      --bg: #f4f0e6;
      --panel: #fff8ea;
      --ink: #2f2a24;
      --accent: #2f7d4b;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 10%, #fff9ef 0%, var(--bg) 55%, #e9dfd0 100%);
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    #app {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: color-mix(in srgb, var(--panel) 88%, white 12%);
      border: 1px solid #dfd2ba;
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 12px 30px rgba(64, 45, 19, 0.12);
      max-width: 360px;
      line-height: 1.45;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0;
      font-size: 0.9rem;
    }
    .chip {
      display: inline-block;
      margin-top: 8px;
      background: #e8f5ec;
      color: #155d34;
      border: 1px solid #b6d8c0;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <h1>Terrain 3D depuis courbes de niveau</h1>
      <p>Glisser: rotation, molette: zoom, clic droit: déplacement. Les couches du DXF sont projetées sur <strong>topoexport_terrain.obj</strong>.</p>
      <span class="chip" id="status">Chargement...</span>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

    const app = document.getElementById('app');
    const statusEl = document.getElementById('status');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#efe5d4');

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100000);
    camera.position.set(300, 250, 300);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    scene.add(new THREE.HemisphereLight('#fff5d8', '#8a7455', 1.1));
    const sun = new THREE.DirectionalLight('#ffffff', 1.0);
    sun.position.set(250, 400, 180);
    scene.add(sun);

    const grid = new THREE.GridHelper(1200, 24, '#6a7f66', '#b8b9a4');
    grid.position.y = -2;
    scene.add(grid);

    const mapRoot = new THREE.Group();
    scene.add(mapRoot);

    let terrainLoaded = false;
    let buildingsLoaded = false;
    let linesLoaded = false;

    function updateStatus() {
      if (terrainLoaded && buildingsLoaded && linesLoaded) {
        statusEl.textContent = 'Terrain + couches projetées chargés';
        return;
      }
      const parts = [];
      if (terrainLoaded) parts.push('terrain');
      if (buildingsLoaded) parts.push('batiments');
      if (linesLoaded) parts.push('lignes');
      statusEl.textContent = parts.length ? `Chargé: ${parts.join(', ')}` : 'Chargement...';
    }

    const loader = new OBJLoader();
    loader.load(
      './topoexport_terrain.obj',
      (obj) => {
        const material = new THREE.MeshStandardMaterial({
          color: '#7ca37a',
          roughness: 0.82,
          metalness: 0.04,
          flatShading: false,
        });

        obj.traverse((child) => {
          if (child.isMesh) {
            child.material = material;
            child.castShadow = false;
            child.receiveShadow = true;
            child.geometry.computeVertexNormals();
          }
        });

        const box = new THREE.Box3().setFromObject(obj);
        const center = box.getCenter(new THREE.Vector3());
        mapRoot.position.set(-center.x, -center.y, -center.z);

        // DXF/OBJ is generated with Z-up coordinates; Three.js scenes are Y-up.
        mapRoot.rotation.x = -Math.PI / 2;

        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const fitDistance = maxDim * 1.2;
        camera.position.set(fitDistance, fitDistance * 0.75, fitDistance);
        controls.target.set(0, 0, 0);
        controls.update();

        mapRoot.add(obj);
        terrainLoaded = true;
        updateStatus();
      },
      undefined,
      (err) => {
        console.error(err);
        statusEl.textContent = 'Erreur de chargement OBJ';
      }
    );

    loader.load(
      './topoexport_buildings.obj',
      (obj) => {
        const material = new THREE.MeshStandardMaterial({
          color: '#d9b389',
          roughness: 0.86,
          metalness: 0.03,
        });

        obj.traverse((child) => {
          if (child.isMesh) {
            child.material = material;
            child.castShadow = false;
            child.receiveShadow = true;
            child.geometry.computeVertexNormals();
          }
        });

        mapRoot.add(obj);
        buildingsLoaded = true;
        updateStatus();
      },
      undefined,
      (err) => {
        console.error(err);
        statusEl.textContent = 'Erreur de chargement batiments';
      }
    );

    fetch('./topoexport_projected_lines.json')
      .then((r) => r.json())
      .then((data) => {
        const lineGroup = new THREE.Group();
        const features = Array.isArray(data?.features) ? data.features : [];

        for (const feat of features) {
          const pts = Array.isArray(feat.points) ? feat.points : [];
          if (pts.length < 2) continue;

          const positions = new Float32Array(pts.length * 3);
          for (let i = 0; i < pts.length; i += 1) {
            positions[i * 3 + 0] = pts[i][0];
            positions[i * 3 + 1] = pts[i][1];
            positions[i * 3 + 2] = pts[i][2];
          }

          const geom = new THREE.BufferGeometry();
          geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          const mat = new THREE.LineBasicMaterial({ color: feat.color || '#444' });
          const line = new THREE.Line(geom, mat);
          lineGroup.add(line);
        }

        mapRoot.add(lineGroup);
        linesLoaded = true;
        updateStatus();
      })
      .catch((err) => {
        console.error(err);
        statusEl.textContent = 'Erreur de chargement des lignes';
      });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
