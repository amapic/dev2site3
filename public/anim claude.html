<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation d'activation — icône radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{
    --ink:#EDEAE3;
    --ink-dim:#93A0A3;
    --bg-0:#0E1A1F;
    --bg-1:#122229;
    --grid-line: rgba(237,234,227,0.05);
    --accent:#FF9A44;
    --idle-stroke: #45585D;
    --ok: #7CD6A4;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 42%, var(--bg-1), var(--bg-0) 70%);
    font-family:'Space Grotesk', system-ui, sans-serif;
    color:var(--ink);
    overflow:hidden;
  }
  .field{
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 64px);
    mask-image: radial-gradient(circle at 50% 45%, black 0%, transparent 72%);
    -webkit-mask-image: radial-gradient(circle at 50% 45%, black 0%, transparent 72%);
    pointer-events:none;
  }
  .panel{
    position:relative; display:flex; flex-direction:column;
    align-items:center; gap:28px; padding: 48px 40px;
  }
  .stage{
    position:relative; width: 220px; height: 220px;
    display:flex; align-items:center; justify-content:center;
  }
  .pulse-ring{
    position:absolute; width: 132px; height: 132px; border-radius:50%;
    border: 1.5px solid var(--accent); opacity:0; pointer-events:none;
  }
  .icon-btn{
    position:relative; width: 132px; height: 132px; border-radius:50%;
    border: none; background: rgba(237,234,227,0.03); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 6px; }
  .icon-btn svg{ width: 84px; height: 84px; overflow: visible; }
  .iconRing{
    fill:none; stroke: var(--idle-stroke); stroke-width: 1.6;
    transform-box: fill-box; transform-origin: 50% 50%;
  }
  .iconLine{
    fill:none; stroke: var(--idle-stroke); stroke-width: 1.6; stroke-linecap: round;
    transform-box: fill-box; transform-origin: 50% 50%;
  }
  .iconFill{
    fill: var(--idle-stroke);
    transform-box: fill-box; transform-origin: 50% 50%;
  }
  .status{ display:flex; flex-direction: column; align-items:center; gap:6px; }
  .status-label{
    font-family:'IBM Plex Mono', monospace; font-size: 12px;
    letter-spacing: 0.14em; color: var(--ink-dim);
  }
  .status-value{
    font-family:'IBM Plex Mono', monospace; font-size: 13px;
    letter-spacing: 0.14em; color: var(--ink-dim);
    min-width: 108px; text-align:center;
  }
  .status-value.is-active{ color: var(--ok); }
  .hint{
    font-size: 13px; color: var(--ink-dim); max-width: 320px;
    text-align:center; line-height:1.5;
  }
  @media (prefers-reduced-motion: reduce){
    * { animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

<div class="field" aria-hidden="true"></div>

<div class="panel">
  <div class="stage">
    <span class="pulse-ring" data-pulse></span>
    <span class="pulse-ring" data-pulse></span>
    <button class="icon-btn" id="iconBtn" aria-pressed="false" aria-label="Activer le capteur">
      <svg viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="16" class="iconRing" id="ring"></circle>
        <circle cx="20" cy="20" r="7.5" class="iconLine" id="innerCircle"></circle>
        <path d="M20 6v5M20 29v5M6 20h5M29 20h5" class="iconLine" id="ticks"></path>
        <circle cx="20" cy="20" r="2.6" class="iconFill" id="dot"></circle>
      </svg>
    </button>
  </div>

  <div class="status">
    <span class="status-label">CAPTEUR</span>
    <span class="status-value" id="statusValue">— EN VEILLE —</span>
  </div>

  <p class="hint">Cliquez sur l'icône pour rejouer l'animation d'activation.</p>
</div>

<script>
(function(){
  const ring = document.getElementById('ring');
  const innerCircle = document.getElementById('innerCircle');
  const ticks = document.getElementById('ticks');
  const dot = document.getElementById('dot');
  const btn = document.getElementById('iconBtn');
  const statusValue = document.getElementById('statusValue');
  const pulses = Array.from(document.querySelectorAll('[data-pulse]'));

  const idleColor = '#45585D';
  const accentColor = '#FF9A44';

  const RING_LEN = ring.getTotalLength();
  gsap.set(ring, { strokeDasharray: RING_LEN, strokeDashoffset: RING_LEN });
  gsap.set([innerCircle, ticks, dot], { scale: 0 });
  gsap.set([ring, innerCircle, ticks], { stroke: idleColor });
  gsap.set(dot, { fill: idleColor });

  let playing = false;

  function activate(){
    if (playing) return;
    playing = true;
    btn.setAttribute('aria-pressed', 'true');
    statusValue.textContent = '— EN VEILLE —';
    statusValue.classList.remove('is-active');

    const tl = gsap.timeline({
      defaults: { ease: 'power2.out' },
      onComplete: () => { playing = false; }
    });

    gsap.set(ring, { strokeDashoffset: RING_LEN, rotate: -90 });
    gsap.set([innerCircle, ticks, dot], { scale: 0, rotate: 0 });
    gsap.set([ring, innerCircle, ticks], { stroke: idleColor });
    gsap.set(dot, { fill: idleColor, scale: 0 });
    gsap.set(pulses, { opacity: 0, scale: 0.6 });

    tl.to(btn, { scale: 0.94, duration: 0.12, ease: 'power1.out' }, 0)
      .to(btn, { scale: 1, duration: 0.35, ease: 'back.out(3)' }, 0.12)
      .to(ring, { strokeDashoffset: 0, rotate: 0, duration: 0.6, ease: 'power2.inOut' }, 0.05)
      .to(ring, { stroke: accentColor, duration: 0.4 }, 0.1)
      .to(innerCircle, { scale: 1, duration: 0.45, ease: 'back.out(2.6)' }, 0.32)
      .to(innerCircle, { stroke: accentColor, duration: 0.3 }, 0.32)
      .to(ticks, { scale: 1, duration: 0.4, ease: 'back.out(3.2)' }, 0.4)
      .to(ticks, { stroke: accentColor, duration: 0.3 }, 0.4)
      .to(dot, { scale: 1.35, fill: accentColor, duration: 0.18, ease: 'power2.out' }, 0.5)
      .to(dot, { scale: 1, duration: 0.25, ease: 'power1.inOut' }, 0.68)
      .to(pulses[0], { opacity: 0.9, scale: 1, duration: 0.05 }, 0.5)
      .to(pulses[0], { opacity: 0, scale: 2.4, duration: 0.9, ease: 'power1.out' }, 0.5)
      .to(pulses[1], { opacity: 0.6, scale: 1, duration: 0.05 }, 0.68)
      .to(pulses[1], { opacity: 0, scale: 2.4, duration: 0.9, ease: 'power1.out' }, 0.68)
      .call(() => {
        statusValue.textContent = '— ACTIF —';
        statusValue.classList.add('is-active');
      }, [], 0.55);
  }

  btn.addEventListener('click', activate);
  window.addEventListener('load', () => setTimeout(activate, 400));
})();
</script>

</body>
</html>
