<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Trames colorees croisees</title>
  <desc id="desc">Trois trames de points ondulees qui se croisent, en bleu, cyan et jaune sur fond transparent.</desc>

  <defs>
    <pattern id="dots-blue" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3.2" fill="#003d82" />
    </pattern>

    <pattern id="dots-cyan" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="translate(3 2)">
      <circle cx="9" cy="9" r="2.9" fill="#00d4d4" />
    </pattern>

    <pattern id="dots-yellow" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="translate(-2 3)">
      <circle cx="9" cy="9" r="2.8" fill="#ffc837" />
    </pattern>

    <linearGradient id="fade-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="black" stop-opacity="0" />
      <stop offset="18%" stop-color="white" stop-opacity="0.85" />
      <stop offset="50%" stop-color="white" stop-opacity="1" />
      <stop offset="82%" stop-color="white" stop-opacity="0.85" />
      <stop offset="100%" stop-color="black" stop-opacity="0" />
    </linearGradient>

    <mask id="band-mask-1" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="1400" height="560">
      <rect width="1400" height="560" fill="black" />
      <path d="M -80 345 C 210 170 460 470 760 285 C 1020 130 1210 430 1490 305" fill="none" stroke="url(#fade-band)" stroke-width="170" stroke-linecap="round" stroke-linejoin="round" />
    </mask>

    <mask id="band-mask-2" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="1400" height="560">
      <rect width="1400" height="560" fill="black" />
      <path d="M -120 220 C 170 410 430 130 700 300 C 990 485 1180 170 1500 260" fill="none" stroke="url(#fade-band)" stroke-width="160" stroke-linecap="round" stroke-linejoin="round" />
    </mask>

    <mask id="band-mask-3" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="1400" height="560">
      <rect width="1400" height="560" fill="black" />
      <path d="M -140 295 C 160 120 390 455 670 255 C 980 35 1180 420 1510 345" fill="none" stroke="url(#fade-band)" stroke-width="132" stroke-linecap="round" stroke-linejoin="round" />
    </mask>
  </defs>

  <g mask="url(#band-mask-1)" opacity="0.88">
    <rect width="1400" height="560" fill="url(#dots-blue)" />
  </g>

  <g mask="url(#band-mask-2)" opacity="0.86">
    <rect width="1400" height="560" fill="url(#dots-cyan)" />
  </g>

  <g mask="url(#band-mask-3)" opacity="0.82">
    <rect width="1400" height="560" fill="url(#dots-yellow)" />
  </g>
</svg>