# Configuration Apache2 corrigée pour api.marie-durand.fr
# Cette configuration évite les conflits avec dev2site.net

# Redirection HTTP -> HTTPS
<VirtualHost *:80>
    ServerName api.marie-durand.fr

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =api.marie-durand.fr
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/marie-durand-error.log
    CustomLog ${APACHE_LOG_DIR}/marie-durand-access.log combined
</VirtualHost>

# HTTPS Configuration
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.marie-durand.fr

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.marie-durand.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.marie-durand.fr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On

    # SOLUTION 1: Si vous voulez une instance Strapi séparée pour marie-durand
    # Décommentez ces lignes et commentez la SOLUTION 2
    # ProxyPass / http://127.0.0.1:1338/
    # ProxyPassReverse / http://127.0.0.1:1338/

    # SOLUTION 2: Si vous voulez partager la même instance Strapi
    # Commentez ces lignes si vous utilisez la SOLUTION 1
    
    # Configuration CORS pour Vercel
    <Location "/">
        Header unset Access-Control-Allow-Origin
        Header unset Access-Control-Allow-Methods  
        Header unset Access-Control-Allow-Headers
        Header unset Access-Control-Max-Age
        
        Header set Access-Control-Allow-Origin "https://marie-durand.vercel.app"
        Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header set Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization"
        Header set Access-Control-Max-Age "3600"
        
        # Gestion des requêtes OPTIONS (preflight)
        RewriteEngine On
        RewriteCond %{REQUEST_METHOD} OPTIONS
        RewriteRule .* - [R=200,L,E=HTTP_ORIGIN:%{HTTP:Origin}]
    </Location>

    # Proxy vers Strapi avec préfixe pour éviter les conflits
    ProxyPass /api/ http://127.0.0.1:1337/api/
    ProxyPassReverse /api/ http://127.0.0.1:1337/api/
    
    # Admin Strapi pour marie-durand (optionnel)
    ProxyPass /admin/ http://127.0.0.1:1337/admin/
    ProxyPassReverse /admin/ http://127.0.0.1:1337/admin/
    
    # Uploads Strapi
    <Location "/uploads/">
        Header unset Access-Control-Allow-Origin
        Header set Access-Control-Allow-Origin "https://marie-durand.vercel.app"
    </Location>
    ProxyPass /uploads/ http://127.0.0.1:1337/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:1337/uploads/

    ErrorLog ${APACHE_LOG_DIR}/marie-durand-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/marie-durand-ssl-access.log combined
</VirtualHost>
</IfModule>